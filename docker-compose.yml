services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      # Optional local management console (guest / guest) to inspect chat.events fanout & per-node queues
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-1:
    build:
      context: ./backend
    environment:
      INSTANCE_ID: node-1
      SERVER_PORT: 8080
      WS_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/chatdb
      DB_USER: chatuser
      DB_PASSWORD: chatpass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      BROKER_TYPE: rabbitmq
      WS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-2:
    build:
      context: ./backend
    environment:
      INSTANCE_ID: node-2
      SERVER_PORT: 8080
      WS_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/chatdb
      DB_USER: chatuser
      DB_PASSWORD: chatpass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      BROKER_TYPE: rabbitmq
      WS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy

volumes:
  postgres_data:
