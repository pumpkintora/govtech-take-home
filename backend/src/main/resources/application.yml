server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: realtime-chat-backend
  threads:
    # Enable Java 21 Virtual Threads for Tomcat HTTP workers as well so REST bursts
    # (e.g., reconnect storm gap-syncs) scale cleanly alongside the raw WebSocket server.
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatdb}
    username: ${DB_USER:chatuser}
    password: ${DB_PASSWORD:chatpass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  sql:
    init:
      # Schema initialization is performed by SchemaInitializer under a PostgreSQL
      # advisory lock to prevent concurrent DDL race conditions when multiple replicas boot.
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  instance-id: ${INSTANCE_ID:node-local}
  ws:
    port: ${WS_PORT:8081}
    max-payload-bytes: ${WS_MAX_PAYLOAD_BYTES:65536}
    outbound-queue-capacity: ${WS_OUTBOUND_QUEUE_CAPACITY:256}
    heartbeat-interval-seconds: ${WS_HEARTBEAT_INTERVAL_SECONDS:15}
    heartbeat-timeout-seconds: ${WS_HEARTBEAT_TIMEOUT_SECONDS:45}
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
  auth:
    session-cookie-name: CHAT_SESSION
    session-ttl-hours: 168
    cookie-secure: ${COOKIE_SECURE:false}
  broker:
    # 'rabbitmq' for multi-node horizontal scaling; 'memory' for standalone/unit tests.
    type: ${BROKER_TYPE:rabbitmq}
    exchange: chat.events
  seed-demo-users: ${SEED_DEMO_USERS:true}

logging:
  level:
    com.chat: INFO
